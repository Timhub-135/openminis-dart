# Gradle JVM settings. Kept deliberately small: the Android build of this app
# also packs a ~150 MB VM payload, and CI runners (or a phone-hosted build) can
# be tight on RAM — an oversized daemon heap made the build get OOM-killed.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
# One build per invocation: no resident daemon to be killed by the OS, and the
# Kotlin compiler runs in-process instead of spawning a second JVM.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
